name: Sync Wiki to GitHub Wiki

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wiki/**'

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone GitHub Wiki repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git \
            wiki_repo

      - name: Sync wiki content
        run: |
          rsync -av --delete --exclude='.git' wiki/ wiki_repo/

      - name: Commit and push to wiki
        run: |
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit in wiki."
          else
            git commit -m "Auto-update wiki from main repo (${{ github.sha }})"
            git push origin HEAD
            echo "Wiki updated successfully!"
          fi
